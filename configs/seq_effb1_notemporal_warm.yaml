# Warm start of seq_effb1_notemporal.yaml from the trained pair model (§14), lr 1e-4.
# Batch = 4 windows x 15 pairs = 60 pairs/step. Compare temporal vs notemporal warm runs (same init, lr, data).
arm: SEQ-effb1-notemporal-warm
L: 16
init_pair: outputs/pose/pilot_CNN-effb1-imnet_s17/last.pt
model: {backbone: effb1, imagenet: true, dim: 256, depth: 2, heads: 4, temporal: false}
loss: {sigma_rot: 0.002, sigma_trans: 0.4}
loss_offsets: [1, 2, 4, 8]
out_dir: outputs
seed: 17
size: [192, 256]
split: configs/splits/split_v1.json
train: {steps: 5000, batch: 4, lr: 1.0e-4, wd: 0.01, warmup: 200, workers: 8, eval_every: 1000, eval_scans_every: 7}
