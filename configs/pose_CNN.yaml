# Control arm: lightweight CNN trained from scratch for this task, early fusion of the two frames (models/pair_cnn.py). Same protocol as pose_base / A1.
arm: CNN
encoder: {type: cnn}
model: {widths: [32, 64, 128, 256], dim: 256}
loss: {sigma_rot: 0.002, sigma_trans: 0.4, nll: false}
offsets: [1, 2, 4, 8]
out_dir: outputs
seed: 17
size: [192, 256]
split: configs/splits/split_v1.json
train: {steps: 5000, batch: 32, lr: 3.0e-4, wd: 0.01, warmup: 200, workers: 8, eval_every: 1000, eval_scans_every: 7, reverse_prob: 0.0}
wandb: {enabled: false, project: usmotion4d}
