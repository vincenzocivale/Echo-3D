# Pilot config shared by A0..A3 (same split, preprocessing, budget, evaluation; only `arm` changes)
arm: A1
seed: 17
split: configs/splits/split_v1.json
size: [192, 256]            # frames area-resized; 12x16 USFM tokens of 16 px
offsets: [1, 2, 4, 8]
encoder: {layers: [8, 12], pretrained: true, frozen: true}   # USFM ViT-B/16 (already prepared, NOT USF-MAE)
model: {dim: 256, depth: 2, heads: 8, sinkhorn_iters: 3}
loss: {sigma_rot: 0.002, sigma_trans: 0.4, nll: false}        # per-frame-step magnitudes from TUS-REC stats (rms rot 2.0 mrad, mean |t| 0.40 mm)
train: {steps: 5000, batch: 32, lr: 3.0e-4, wd: 0.01, warmup: 200, workers: 8, eval_every: 1000, eval_scans_every: 7, reverse_prob: 0.0}  # forward pairs only: see docs/EXPERIMENT_REPORT.md (sign of elevational motion)
out_dir: outputs
wandb: {enabled: false, project: usmotion4d}
